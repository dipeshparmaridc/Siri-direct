<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siri climate prototype</title>
<style>
:root{--bg:#eceef1;--ink:#14181f;--muted:#5d6672;--panel:#fff;--line:#d5d9df;--accent:#0a6cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--ink:#eef0f3;--muted:#9aa3af;--panel:#1f242b;--line:#323941;--accent:#5a9bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181d;--ink:#eef0f3;--muted:#9aa3af;--panel:#1f242b;--line:#323941;--accent:#5a9bff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 12px 28px}
h1{font-size:16px;margin:0;font-weight:600}
.hint,.step{font-size:13px;color:var(--muted);margin:0;text-align:center}
.phone{width:375px;max-width:100%;aspect-ratio:450/974;border-radius:40px;overflow:hidden;border:6px solid #000;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.25);background:#222;container-type:inline-size;cursor:pointer}
.phone img{position:absolute;display:block}
.full{inset:0;width:100%;height:100%;object-fit:cover}
#orb{left:34.889%;top:84.497%;width:29.333%;height:13.552%;opacity:0;transition:opacity .25s}
#pill{left:6.667%;top:76.181%;width:86.667%;height:9.24%;opacity:0;transition:opacity .2s}
#txt{position:absolute;left:6.667%;top:76.181%;width:86.667%;height:9.24%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:3.9cqw;font-weight:500;line-height:1.2;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;padding-bottom:1.2cqw}
.on{opacity:1!important}
.hidden{display:none!important}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ctl button{padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px}
.ctl .go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.ctl button:disabled{opacity:.5}
@media (prefers-reduced-motion:reduce){#orb,#pill,#txt{transition:none}}
</style>
</head>
<body>

<p class="step" id="step">1 of 3 · Home</p>
<div class="ctl"><button class="go" id="go">Hey Siri</button><button id="reset">Restart</button></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},T=[],go=$("go"),CMD="Set my car temperature to 24";
function at(f,ms){T.push(setTimeout(f,ms))}
function clr(){T.forEach(clearTimeout);T=[]}
function reset(){clr();["orb","pill","txt"].forEach(function(i){$(i).classList.remove("on")});$("done").classList.add("hidden");$("l2").textContent="";$("step").textContent="1 of 3 · Home";go.disabled=false}
function run(){
  if(go.disabled)return;clr();go.disabled=true;
  $("orb").classList.add("on");$("step").textContent="2 of 3 · Siri listening";
  at(function(){$("pill").classList.add("on");$("txt").classList.add("on")},600);
  at(function(){var i=0;(function n(){if(i<=CMD.length){$("l2").textContent=CMD.slice(0,i++);at(n,55)}else{at(finish,800)}})()},1100);
}
function finish(){$("done").classList.remove("hidden");$("step").textContent="3 of 3 · Done, banner shown"}
go.onclick=run;$("phone").onclick=run;$("reset").onclick=function(e){e.stopPropagation();reset()};
})();
</script>
